name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev qt6-declarative-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSTORLIVE_WITH_LIBOBS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Package deb
        run: cd build && cpack -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: StorLive-Linux-deb
          path: build/*.deb

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true
      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DSTORLIVE_WITH_LIBOBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
      - name: Build
        shell: pwsh
        run: cmake --build build
      - name: Install
        shell: pwsh
        run: cmake --install build --prefix dist
      - name: Portable ZIP
        shell: pwsh
        run: ./packaging/windows/make-portable.ps1 -InstallDir dist -OutputDir artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: StorLive-Windows-x64-portable
          path: artifacts/*.zip
