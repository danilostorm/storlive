name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            libobs-dev obs-plugins xvfb xauth
      - name: Configure with libobs
        run: cmake -S . -B build -G Ninja -DSTORLIVE_WITH_LIBOBS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Verify libobs linkage
        run: |
          ldd build/storlive | grep -E 'libobs\.so'
      - name: Smoke test development build
        shell: bash
        run: |
          find "$HOME/.local/share" -name storlive-startup.log -delete 2>/dev/null || true
          set +e
          QT_QPA_PLATFORM=xcb xvfb-run -a timeout 8s ./build/storlive >storlive-smoke.log 2>&1
          code=$?
          set -e
          cat storlive-smoke.log || true
          find "$HOME/.local/share" -name storlive-startup.log -print -exec cat {} \; 2>/dev/null || true
          if [ "$code" -ne 124 ]; then
            echo "StorLive exited during development startup smoke test (exit=$code)" >&2
            exit 1
          fi
          grep -R -F "Engine: libobs " "$HOME/.local/share/StorLive" >/dev/null || {
            echo "libobs engine did not initialize in development smoke test" >&2
            exit 1
          }
      - name: Package deb
        run: cd build && cpack -G DEB
      - name: Verify Debian runtime dependencies
        shell: bash
        run: |
          pkg="$(find build -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$pkg"
          deps="$(dpkg-deb -f "$pkg" Depends)"
          echo "$deps"
          for dep in qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript obs-plugins; do
            printf '%s' "$deps" | grep -F "$dep" >/dev/null || { echo "Missing package dependency: $dep" >&2; exit 1; }
          done
      - name: Smoke test installed deb without libobs-dev
        shell: bash
        run: |
          pkg_rel="$(find build -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$pkg_rel"
          pkg="$(realpath "$pkg_rel")"
          test -f "$pkg"
          sudo apt-get remove -y libobs-dev
          sudo apt-get install -y "$pkg"
          test ! -e /usr/lib/x86_64-linux-gnu/libobs-opengl.so
          test -e /usr/lib/x86_64-linux-gnu/libobs-opengl.so.30
          find "$HOME/.local/share" -name storlive-startup.log -delete 2>/dev/null || true
          set +e
          QT_QPA_PLATFORM=xcb xvfb-run -a timeout 8s /usr/bin/storlive >storlive-installed-smoke.log 2>&1
          code=$?
          set -e
          cat storlive-installed-smoke.log || true
          find "$HOME/.local/share" -name storlive-startup.log -print -exec cat {} \; 2>/dev/null || true
          if [ "$code" -ne 124 ]; then
            echo "Installed StorLive exited during startup smoke test (exit=$code)" >&2
            exit 1
          fi
          grep -R -F "Engine: libobs " "$HOME/.local/share/StorLive" >/dev/null || {
            echo "Installed .deb stayed open but libobs video engine did not initialize" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: StorLive-Linux-deb
          path: build/*.deb
          retention-days: 30

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true
      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare OBS 30.0.2 runtime and SDK
        shell: pwsh
        run: ./packaging/windows/prepare-obs-runtime.ps1 -Version 30.0.2 -WorkDir .obs-runtime
      - name: Configure with libobs
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DSTORLIVE_WITH_LIBOBS=ON -DSTORLIVE_OBS_ROOT="$pwd/.obs-runtime/sdk" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
      - name: Build
        shell: pwsh
        run: cmake --build build
      - name: Install
        shell: pwsh
        run: cmake --install build --prefix dist
      - name: Portable ZIP with embedded libobs
        shell: pwsh
        run: ./packaging/windows/make-portable.ps1 -InstallDir dist -OutputDir artifacts -ObsRuntimeRoot .obs-runtime/runtime
      - name: Verify production backend and portable dependencies
        shell: pwsh
        run: |
          $required = @(
            'dist/storlive.exe',
            'dist/qt.conf',
            'dist/MSVCP140.dll',
            'dist/MSVCP140_1.dll',
            'dist/MSVCP140_2.dll',
            'dist/VCRUNTIME140.dll',
            'dist/VCRUNTIME140_1.dll',
            'dist/obs.dll',
            'dist/libobs-d3d11.dll',
            'dist/obs-plugins/64bit/obs-outputs.dll',
            'dist/obs-plugins/64bit/rtmp-services.dll',
            'dist/obs-plugins/64bit/win-capture.dll',
            'dist/obs-plugins/64bit/win-dshow.dll',
            'dist/obs-plugins/64bit/win-wasapi.dll',
            'dist/data/libobs',
            'dist/qml/QtQuick/Controls/qtquickcontrols2plugin.dll',
            'dist/qml/QtQuick/Templates/qtquicktemplates2plugin.dll',
            'dist/qml/QtQuick/Window/quickwindowplugin.dll',
            'dist/qml/QtQuick/Layouts/qquicklayoutsplugin.dll',
            'dist/platforms/qwindows.dll'
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Missing production runtime item: $item" }
          }
          $imports = (& dumpbin.exe /nologo /imports dist/storlive.exe) -join "`n"
          if ($imports -notmatch '(?im)^\s*obs\.dll\s*$') { throw 'storlive.exe is not linked to obs.dll' }
      - name: Smoke test extracted portable and libobs video engine
        shell: pwsh
        run: |
          $smokeDir = Join-Path $pwd 'portable-smoke'
          Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path 'artifacts/StorLive-Windows-x64-portable.zip' -DestinationPath $smokeDir -Force
          Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter storlive-startup.log -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path (Join-Path $smokeDir 'storlive.exe')).Path
          $process = Start-Process -FilePath $exe -WorkingDirectory $env:TEMP -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            Write-Host "StorLive exited with code $($process.ExitCode)"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'storlive\.exe' } |
              Select-Object -First 5 -ExpandProperty Message | Write-Host
            throw "StorLive exited during extracted portable startup smoke test (exit=$($process.ExitCode))"
          }
          $logs = @(Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter storlive-startup.log -ErrorAction SilentlyContinue)
          $engineOk = $false
          foreach ($log in $logs) {
            Write-Host "--- $($log.FullName) ---"
            $content = Get-Content $log.FullName -Raw
            Write-Host $content
            if ($content -match 'Engine: libobs .* inicializado') { $engineOk = $true }
          }
          if (-not $engineOk) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Portable stayed open but libobs/D3D11 video engine did not initialize'
          }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: StorLive-Windows-x64-portable
          path: artifacts/*.zip
          retention-days: 30

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v'))
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Resolve release tag
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1 | sed -E 's/^release:[[:space:]]*//')"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create checksums
        shell: bash
        run: |
          cd release-artifacts
          find . -type f \( -name '*.zip' -o -name '*.deb' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          mapfile -t files < <(find release-artifacts -type f \( -name '*.zip' -o -name '*.deb' \) -print)
          files+=("release-artifacts/SHA256SUMS.txt")
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "StorLive $RELEASE_TAG" --generate-notes
          fi
